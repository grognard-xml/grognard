name: CI
run-name: CI for grognard-xml/grognard

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: main

permissions:
  contents: write

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format-check

  desktop-linux:
    name: Build Linux desktop package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            script: build:desktop:linux:amd64
          - arch: arm64
            script: build:desktop:linux:arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache game assets binary
        uses: actions/cache@v5
        with:
          path: apps/desktop/resources/game-assets/assets.bin
          key: game-assets-${{ hashFiles('apps/desktop/resources/game-assets/assets.manifest.json') }}

      - name: Fetch game assets from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/fetch-game-assets.mjs

      - name: Build Linux desktop package
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Running ${{ matrix.script }} attempt $attempt of $attempts"
            package_exit=0
            npm run ${{ matrix.script }} || package_exit=$?
            if [ "$package_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              exit "$package_exit"
            fi
            echo "${{ matrix.script }} failed with exit code $package_exit. Waiting before retry..."
            sleep $((10 * attempt))
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.arch }}
          path: apps/desktop/release/*.deb
          if-no-files-found: error

  desktop-flatpak:
    name: Build Linux desktop Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: npm ci

      - name: Cache game assets binary
        uses: actions/cache@v5
        with:
          path: apps/desktop/resources/game-assets/assets.bin
          key: game-assets-${{ hashFiles('apps/desktop/resources/game-assets/assets.manifest.json') }}

      - name: Fetch game assets from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/fetch-game-assets.mjs

      - name: Build Flatpak
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Running build:desktop:flatpak:ci attempt $attempt of $attempts"
            package_exit=0
            npm run build:desktop:flatpak:ci || package_exit=$?
            if [ "$package_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              exit "$package_exit"
            fi
            echo "build:desktop:flatpak:ci failed with exit code $package_exit. Waiting before retry..."
            sleep $((10 * attempt))
          done

  desktop-macos:
    name: Build macOS desktop application (${{ matrix.label }})
    # macos-15 runners are arm64: the arm64 pkg builds natively, and the x64
    # (Intel) pkg is cross-built via an explicit electron-builder arch flag.
    # The LJB_*_ARCH vars on the package step below make the bundled Python,
    # pmtiles and LemMinX binaries follow that flag instead of the runner's
    # own architecture, which would otherwise ship arm64 payloads inside the
    # Intel app.
    runs-on: macos-15
    # The commons webpack build inlines the bundled GlyphWiki JSON (~47 MB),
    # which overruns Node's default ~2 GB heap on 7 GB macOS runners.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple silicon
          - arch: x64
            label: Intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache game assets binary
        uses: actions/cache@v5
        with:
          path: apps/desktop/resources/game-assets/assets.bin
          key: game-assets-${{ hashFiles('apps/desktop/resources/game-assets/assets.manifest.json') }}

      - name: Fetch game assets from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/fetch-game-assets.mjs

      - name: Import code-signing certificates
        env:
          # Developer ID Application (signs the app) and Developer ID
          # Installer (signs the pkg), as separate base64-encoded .p12 files.
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          MAC_INSTALLER_CERTS_P12: ${{ secrets.MAC_INSTALLER_CERTS_P12 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTS_P12" ]; then
            echo "No signing certificates configured; building unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          import_p12() {
            [ -z "$1" ] && return 0
            printf '%s' "$1" | base64 -d > "$RUNNER_TEMP/certs.p12"
            security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$MAC_CERTS_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/certs.p12"
          }
          import_p12 "$MAC_CERTS_P12"
          import_p12 "$MAC_INSTALLER_CERTS_P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build macOS desktop application (${{ matrix.arch }})
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN_FOR_PUBLISH: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build-commons

      - name: Package macOS desktop application (${{ matrix.arch }})
        env:
          # package:mac triggers prepackage:mac, which downloads the Python
          # runtime, pmtiles and LemMinX. Pin them to the arch being packaged.
          GROGNARD_PYTHON_PLATFORM: darwin
          GROGNARD_PYTHON_ARCH: ${{ matrix.arch }}
          GROGNARD_PMTILES_PLATFORM: darwin
          GROGNARD_PMTILES_ARCH: ${{ matrix.arch }}
          GROGNARD_LEMMINX_PLATFORM: darwin
          GROGNARD_LEMMINX_ARCH: ${{ matrix.arch }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN_FOR_PUBLISH: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/desktop
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple_api_key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
          fi
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            export GH_TOKEN="$GITHUB_TOKEN_FOR_PUBLISH"
            package_args=(npm run package:mac -- --${{ matrix.arch }})
          else
            package_args=(npm run package:mac -- --${{ matrix.arch }} --publish never)
          fi

          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Running mac package attempt $attempt of $attempts"
            package_exit=0
            "${package_args[@]}" || package_exit=$?
            if [ "$package_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              exit "$package_exit"
            fi
            echo "mac package failed with exit code $package_exit. Waiting before retry..."
            sleep $((10 * attempt))
          done

      - name: Install and verify macOS package
        # Keep this after packaging and before upload: a broken installer must
        # never become a downloadable release asset.
        if: success()
        run: |
          pkg_paths=(apps/desktop/release/*.pkg)
          if [ "${#pkg_paths[@]}" -ne 1 ] || [ ! -f "${pkg_paths[0]}" ]; then
            echo "Expected exactly one macOS pkg, found: ${pkg_paths[*]}"
            exit 1
          fi

          app_path="/Applications/Grognard.app"
          sudo installer -pkg "${pkg_paths[0]}" -target /

          if [ ! -d "$app_path" ]; then
            echo "The pkg installer did not place the app at $app_path"
            echo "Applications directory:"
            find /Applications -maxdepth 1 -name '*.app' -print 2>/dev/null || true
            echo "User Applications directory:"
            find "$HOME/Applications" -maxdepth 1 -name '*.app' -print 2>/dev/null || true
            exit 1
          fi

          test -x "$app_path/Contents/MacOS/Grognard"
          test -f "$app_path/Contents/Resources/app.asar"
          echo "Installed and verified $app_path"

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-pkg-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.pkg
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml

  desktop-windows:
    name: Build Windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      # Configure the runner before checkout so Windows services cannot grab
      # the large game-assets binary while it's being written by the R2
      # fetch step below.
      - name: Prepare Windows workspace protection
        shell: pwsh
        continue-on-error: true
        run: |
          # Best-effort hardening: Defender is not running on the windows-11-arm
          # image, where these cmdlets fail with 0x800106ba. Never fail the job
          # over it -- the build works fine without the exclusions.
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Host "::notice::Skipping Defender exclusions: $($_.Exception.Message)"
          }
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache game assets binary
        uses: actions/cache@v5
        with:
          path: apps/desktop/resources/game-assets/assets.bin
          key: game-assets-${{ hashFiles('apps/desktop/resources/game-assets/assets.manifest.json') }}

      - name: Fetch game assets from R2
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/fetch-game-assets.mjs
          $asset = Get-Item "apps/desktop/resources/game-assets/assets.bin"
          if ($asset.Length -lt 1MB) {
            throw "Fetched asset was not materialized: $($asset.FullName) is only $($asset.Length) bytes"
          }
          Write-Host "Fetched $($asset.FullName) ($([math]::Round($asset.Length / 1MB, 1)) MB)"

      # Belt-and-braces for large/freshly-fetched binaries specifically:
      # read each one through once so this job — not Defender, not the
      # indexer — is the process settling its file handle right before the
      # packaging step needs it, rather than hoping the background scanners
      # happened to finish in the intervening seconds.
      - name: Warm large resource files before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path "apps/desktop/resources" -Recurse -File |
            Where-Object { $_.Length -gt 5MB } |
            ForEach-Object {
              $path = $_.FullName
              $sizeMb = [math]::Round($_.Length / 1MB, 1)
              $attempts = 5
              for ($attempt = 1; $attempt -le $attempts; $attempt++) {
                try {
                  $stream = [System.IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
                  $stream.Close()
                  Write-Host "Warmed $path ($sizeMb MB) on attempt $attempt"
                  break
                } catch {
                  if ($attempt -eq $attempts) {
                    Write-Host "Giving up warming $path after $attempts attempts: $_"
                    break
                  }
                  Write-Host "$path busy on attempt $attempt ($_) — retrying..."
                  Start-Sleep -Seconds (2 * $attempt)
                }
              }
            }

      - name: Build Windows installer (${{ matrix.arch }})
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "Running package:win attempt $attempt of $attempts"
            & npm run package:win -- --${{ matrix.arch }}
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -eq $attempts) {
              throw "package:win failed after $attempts attempts"
            }

            Write-Host "package:win failed with exit code $LASTEXITCODE. Waiting before retry..."
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
