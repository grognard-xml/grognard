name: Release desktop builds

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: main
      release_tag:
        description: Existing release tag to receive assets
        required: true
        default: v0.0.1
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-deb:
    name: Build Linux .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The bundled Python runtime is downloaded for the host architecture
          # (process.arch), so each arch must build on a native runner —
          # otherwise the amd64 host's runtime gets bundled into the arm64
          # .deb, and the app fails to invoke Python on real arm64 machines.
          - arch: amd64
            runner: ubuntu-latest
            script: build:desktop:linux:amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            script: build:desktop:linux:arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: npm ci

      - name: Fetch game assets from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/fetch-game-assets.mjs

      - name: Set package version from release tag
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.release_tag || github.ref_name }}"

      - name: Build desktop package
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Running ${{ matrix.script }} attempt $attempt of $attempts"
            package_exit=0
            npm run ${{ matrix.script }} || package_exit=$?
            if [ "$package_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              exit "$package_exit"
            fi
            echo "${{ matrix.script }} failed with exit code $package_exit. Waiting before retry..."
            sleep $((10 * attempt))
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.arch }}
          path: apps/desktop/release/*.deb
          if-no-files-found: error

  linux-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: npm ci

      - name: Fetch game assets from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/fetch-game-assets.mjs

      - name: Set package version from release tag
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.release_tag || github.ref_name }}"

      - name: Build Flatpak
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Running build:desktop:flatpak:ci attempt $attempt of $attempts"
            package_exit=0
            npm run build:desktop:flatpak:ci || package_exit=$?
            if [ "$package_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              exit "$package_exit"
            fi
            echo "build:desktop:flatpak:ci failed with exit code $package_exit. Waiting before retry..."
            sleep $((10 * attempt))
          done

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak
          path: apps/desktop/release/*.flatpak
          if-no-files-found: error

  macos-pkg:
    name: Build macOS .pkg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Signing and notarization secrets live in the protected "releases"
    # environment (restricted to v* tags).
    environment: releases
    # The commons webpack build inlines the bundled GlyphWiki JSON (~47 MB),
    # which overruns Node's default ~2 GB heap on 7 GB macOS runners.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          # The bundled Python/LemMinX runtimes are downloaded for the host
          # architecture (process.arch), so each arch builds on a native runner.
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch game assets from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/fetch-game-assets.mjs

      - name: Set package version from release tag
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.release_tag || github.ref_name }}"

      - name: Write notary API key
        env:
          APPLE_NOTARY_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_P8 }}
        run: printf '%s\n' "$APPLE_NOTARY_API_PRIVATE_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"

      # Do not hand electron-builder CSC_LINK/CSC_KEY_PASSWORD. Its own keychain
      # path (app-builder-lib createKeychain -> importCerts) creates the
      # keychain with a random password but then calls
      #   security set-key-partition-list ... -k <p12 export password>
      # which wants the *keychain* password, not the .p12 one. That mismatch
      # fails with "SecKeychainUnlock: The user name or passphrase you entered
      # is not correct" whenever security actually has to unlock at that point —
      # it took down the arm64 job of the v0.1.0-beta.12 release while x64
      # passed on the same commit. Building the keychain here and passing it as
      # CSC_KEYCHAIN makes electron-builder skip that code path entirely
      # (macPackager: no cscLink => use process.env.CSC_KEYCHAIN).
      - name: Set up signing keychain
        env:
          APP_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 6h timeout comfortably outlasts the ~30m build; without it the
          # keychain can relock mid-signing.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          import_p12() {
            if [ -n "$1" ]; then
              printf '%s' "$1" | base64 -d > "$RUNNER_TEMP/cert.p12"
              security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$2" \
                -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
              rm -f "$RUNNER_TEMP/cert.p12"
            fi
          }
          import_p12 "$APP_P12_BASE64" "$APP_P12_PASSWORD"
          import_p12 "$INSTALLER_P12_BASE64" "$INSTALLER_P12_PASSWORD"
          # The keychain password, which is the argument this actually wants.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # scripts/sign-mac-extra-resources.mjs runs `security find-identity`
          # with no keychain argument, so the keychain has to be on the user
          # search list for the afterPack hook to sign extraResources at all.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build signed and notarized package
        env:
          # Certificates already live in CSC_KEYCHAIN (previous step);
          # electron-builder auto-discovers the Developer ID Application and
          # Developer ID Installer identities there, then notarizes with the
          # API key below.
          APPLE_API_KEY: ${{ runner.temp }}/notary_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Running build:desktop:mac:release attempt $attempt of $attempts"
            package_exit=0
            npm run build:desktop:mac:release || package_exit=$?
            if [ "$package_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              exit "$package_exit"
            fi
            echo "build:desktop:mac:release failed with exit code $package_exit. Waiting before retry..."
            sleep $((10 * attempt))
          done

      - name: Notarize and staple installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # electron-builder notarizes the .app; the .pkg wrapping it must be
          # notarized as its own artifact, then stapled so installs work
          # offline. Checksums are computed downstream, after stapling.
          for pkg in apps/desktop/release/*.pkg; do
            echo "Notarizing $pkg"
            SUBMISSION="$(xcrun notarytool submit "$pkg" \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 1h --output-format json)"
            echo "$SUBMISSION"
            STATUS="$(echo "$SUBMISSION" | jq -r .status)"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization of $pkg failed with status '$STATUS'. Log:"
              xcrun notarytool log "$(echo "$SUBMISSION" | jq -r .id)" \
                --key "$RUNNER_TEMP/notary_key.p8" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" || true
              exit 1
            fi
            xcrun stapler staple "$pkg"
            spctl --assess -vv --type install "$pkg"
          done
          rm -f "$RUNNER_TEMP/notary_key.p8"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.pkg
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  browser-extension:
    name: Package browser extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Package browser extension zips
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          node scripts/package-browser-extension.mjs "${TAG#v}"

      - name: Upload browser extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: |
            apps/desktop/release/grognard-browser-extension-chromium-*.zip
            apps/desktop/release/grognard-browser-extension-firefox-*.zip
          if-no-files-found: error

  windows:
    name: Build Windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      # Configure the runner before checkout so Windows services cannot grab
      # the large game-assets binary while it's being written by the R2
      # fetch step below.
      - name: Prepare Windows workspace protection
        shell: pwsh
        continue-on-error: true
        run: |
          # Best-effort hardening: Defender is not running on the windows-11-arm
          # image, where these cmdlets fail with 0x800106ba. Never fail the job
          # over it -- the build works fine without the exclusions.
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Host "::notice::Skipping Defender exclusions: $($_.Exception.Message)"
          }
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.release_tag || github.ref_name }}"

      - name: Fetch game assets from R2
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/fetch-game-assets.mjs
          $asset = Get-Item "apps/desktop/resources/game-assets/assets.bin"
          if ($asset.Length -lt 1MB) {
            throw "Fetched asset was not materialized: $($asset.FullName) is only $($asset.Length) bytes"
          }
          Write-Host "Fetched $($asset.FullName) ($([math]::Round($asset.Length / 1MB, 1)) MB)"

      # Belt-and-braces for large/freshly-fetched binaries specifically:
      # read each one through once so this job — not Defender, not the
      # indexer — is the process settling its file handle right before the
      # packaging step needs it.
      - name: Warm large resource files before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path "apps/desktop/resources" -Recurse -File |
            Where-Object { $_.Length -gt 5MB } |
            ForEach-Object {
              $path = $_.FullName
              $sizeMb = [math]::Round($_.Length / 1MB, 1)
              $attempts = 5
              for ($attempt = 1; $attempt -le $attempts; $attempt++) {
                try {
                  $stream = [System.IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
                  $stream.Close()
                  Write-Host "Warmed $path ($sizeMb MB) on attempt $attempt"
                  break
                } catch {
                  if ($attempt -eq $attempts) {
                    Write-Host "Giving up warming $path after $attempts attempts: $_"
                    break
                  }
                  Write-Host "$path busy on attempt $attempt ($_) — retrying..."
                  Start-Sleep -Seconds (2 * $attempt)
                }
              }
            }

      - name: Build Windows installer
        shell: pwsh
        working-directory: apps/desktop
        env:
          # prepackage:win invokes a hardcoded system node.exe (see that
          # script for why); on the arm64 runner that binary can itself be
          # x64, which would make download-python-runtime.mjs silently
          # bundle the wrong-arch Python/sanmiao build. Pin explicitly to
          # what this job is actually packaging for.
          GROGNARD_PYTHON_PLATFORM: win32
          GROGNARD_PYTHON_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "Running package:win attempt $attempt of $attempts"
            & npm run package:win -- --${{ matrix.arch }}
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $attempts) { throw "package:win failed after $attempts attempts" }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Upload Windows updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - linux-deb
      - linux-flatpak
      - macos-pkg
      - windows
      - browser-extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # actions/checkout wipes the workspace directory when it isn't already a
      # git repo, so it must run before anything downloads artifacts into it.
      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download .deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: linux-deb-*
          path: release-assets/debs
          merge-multiple: true

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-flatpak
          path: release-assets/flatpak

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release-assets/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: release-assets/windows
          cache: npm

      - name: Download browser extension artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extension
          path: release-assets/browser-extension

      - name: Install release-tool dependencies
        run: npm ci --ignore-scripts

      # Flatten into one directory so SHA256SUMS contains bare filenames
      # (verifiable with `sha256sum --check` next to the downloads), and
      # fail loudly if two build jobs ever produce the same filename —
      # otherwise one silently overwrites the other in the release.
      - name: Flatten release assets
        run: |
          mkdir -p release-flat
          find release-assets -type f ! -name latest-mac.yml ! -name latest.yml -exec sh -c '
            for f; do
              # GitHub replaces spaces in release asset names with dots;
              # rename to match so SHA256SUMS entries equal the filenames
              # users actually download.
              base="$(basename "$f" | tr " " ".")"
              if [ -e "release-flat/$base" ]; then
                echo "::error::duplicate asset name: $base"
                exit 1
              fi
              mv "$f" "release-flat/$base"
            done' _ {} +

      - name: Combine macOS updater metadata
        run: |
          mapfile -t MAC_UPDATE_FILES < <(find release-assets/mac -name latest-mac.yml -type f | sort)
          if [ "${#MAC_UPDATE_FILES[@]}" -ne 2 ]; then
            echo "::error::expected two latest-mac.yml files, found ${#MAC_UPDATE_FILES[@]}"
            exit 1
          fi
          node scripts/merge-update-info.mjs \
            release-flat/latest-mac.yml "${MAC_UPDATE_FILES[@]}"

      - name: Combine Windows updater metadata
        run: |
          mapfile -t WINDOWS_UPDATE_FILES < <(find release-assets/windows -name latest.yml -type f | sort)
          if [ "${#WINDOWS_UPDATE_FILES[@]}" -ne 2 ]; then
            echo "::error::expected two latest.yml files, found ${#WINDOWS_UPDATE_FILES[@]}"
            exit 1
          fi
          node scripts/merge-update-info.mjs \
            release-flat/latest.yml "${WINDOWS_UPDATE_FILES[@]}"

      - name: Validate automatic-update assets
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          node scripts/validate-updater-assets.mjs release-flat "${VERSION#v}"

      - name: Generate checksums
        working-directory: release-flat
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Provenance for every asset; verify with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-flat/*

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ inputs.release_tag || github.ref_name }}"
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" --generate-notes
          fi
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            release-flat/* \
            --clobber

  # publish-apt.yml has no "release: published" trigger of its own (that
  # fired unordered against these still-running upload steps and failed
  # every time - see publish-apt.yml's header comment); call it directly
  # here instead, gated on every build/upload finishing first.
  apt-repo:
    name: Publish apt repository
    needs: publish
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-apt.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit
